name: Documentation

on:
  # Rebuild and publish when content that affects the docs changes on main.
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'src/behaverify/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  # Validate the build on every PR without deploying.
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'src/behaverify/**'
      - '.github/workflows/docs.yml'
  # Let a maintainer rebuild + redeploy without a new commit
  # (Actions tab -> Documentation -> "Run workflow").
  workflow_dispatch:

# Minimum permissions for the official GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy so PR previews do not overwrite main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install BehaVerify + docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build Sphinx HTML (strict -W)
        run: |
          sphinx-build -b html -W --keep-going -n docs docs/_build/html

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      # For PRs: upload as a regular artifact so reviewers can download
      # and open index.html locally.
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: docs/_build/html
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
